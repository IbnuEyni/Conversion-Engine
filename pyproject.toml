[project]
name = "conversion-engine"
version = "0.1.0"
description = "Automated Lead Generation and Conversion System for Tenacious Consulting and Outsourcing"
requires-python = ">=3.10"
dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.0",
    # LLM
    "openai>=1.82.0",
    "litellm>=1.80.0",
    # Email
    "resend>=2.0.0",
    # SMS
    "africastalking>=1.2.7",
    # CRM
    "hubspot-api-client>=12.0.0",
    # Scraping / Enrichment
    "playwright>=1.52.0",
    "beautifulsoup4>=4.13.0",
    # Data
    "pandas>=2.3.0",
    # Observability
    "langfuse>=3.0.0",
    # Evaluation
    "scipy>=1.15.0",
    # Utilities
    "jinja2>=3.1.0",
    "python-dateutil>=2.9.0",
    "aiofiles>=24.0.0",
    "scrapling>=0.4.7",
    "curl-cffi>=0.15.0",
    "browserforge>=1.2.4",
    "patchright>=1.59.1",
    "msgspec>=0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
